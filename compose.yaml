x-app-environment: &app-environment
  POSTGRES_DSN: ${POSTGRES_DSN:-postgres://documents:local-password@db:5432/documents?sslmode=disable}
  ADMIN_TOKEN: ${ADMIN_TOKEN:-local-admin-token-change-me}
  HTTP_HOST: ${HTTP_HOST:-0.0.0.0}
  HTTP_PORT: ${HTTP_PORT:-8080}
  STORAGE_DRIVER: ${STORAGE_DRIVER:-filesystem}
  FILE_STORAGE_ROOT: ${FILE_STORAGE_ROOT:-/data/blobs}
  S3_ENDPOINT: ${S3_ENDPOINT:-}
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_BUCKET: ${S3_BUCKET:-}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
  S3_SECRET_KEY: ${S3_SECRET_KEY:-}
  S3_USE_TLS: ${S3_USE_TLS:-true}
  SESSION_TTL: ${SESSION_TTL:-24h}
  CACHE_TTL: ${CACHE_TTL:-5m}
  CACHE_MAX_BYTES: ${CACHE_MAX_BYTES:-67108864}
  CACHE_MAX_ITEMS: ${CACHE_MAX_ITEMS:-1000}
  MAX_REQUEST_BYTES: ${MAX_REQUEST_BYTES:-33554432}
  MAX_FILE_BYTES: ${MAX_FILE_BYTES:-26214400}
  MAX_JSON_BYTES: ${MAX_JSON_BYTES:-1048576}
  MAX_GRANT_ITEMS: ${MAX_GRANT_ITEMS:-100}
  MAX_LIST_LIMIT: ${MAX_LIST_LIMIT:-100}
  HTTP_READ_TIMEOUT: ${HTTP_READ_TIMEOUT:-10s}
  HTTP_WRITE_TIMEOUT: ${HTTP_WRITE_TIMEOUT:-30s}
  HTTP_IDLE_TIMEOUT: ${HTTP_IDLE_TIMEOUT:-60s}
  HTTP_PROCESSING_TIMEOUT: ${HTTP_PROCESSING_TIMEOUT:-30s}
  GRACEFUL_SHUTDOWN_TIMEOUT: ${GRACEFUL_SHUTDOWN_TIMEOUT:-10s}
  POSTGRES_MAX_CONNS: ${POSTGRES_MAX_CONNS:-10}
  POSTGRES_MIN_CONNS: ${POSTGRES_MIN_CONNS:-1}
  POSTGRES_MAX_CONN_LIFETIME: ${POSTGRES_MAX_CONN_LIFETIME:-1h}
  POSTGRES_MAX_CONN_IDLE_TIME: ${POSTGRES_MAX_CONN_IDLE_TIME:-30m}
  POSTGRES_HEALTH_CHECK_PERIOD: ${POSTGRES_HEALTH_CHECK_PERIOD:-1m}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  EXPOSE_CACHE_HEADER: ${EXPOSE_CACHE_HEADER:-false}

services:
  db:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-documents}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-password}
      POSTGRES_DB: ${POSTGRES_DB:-documents}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 5s
    restart: unless-stopped

  migrate:
    image: documents:${IMAGE_TAG:-dev}
    build:
      context: .
      target: runtime
    command: ["/usr/local/bin/migrate"]
    entrypoint: []
    environment: *app-environment
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    image: documents:${IMAGE_TAG:-dev}
    build:
      context: .
      target: runtime
    environment: *app-environment
    volumes:
      - blobdata:/data/blobs
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:${HTTP_PORT:-8080}"
    depends_on:
      migrate:
        condition: service_completed_successfully
    init: true
    stop_grace_period: 15s
    restart: unless-stopped

volumes:
  pgdata:
  blobdata:
