name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.6-bookworm
        env:
          POSTGRES_USER: documents
          POSTGRES_PASSWORD: acceptance-password
          POSTGRES_DB: documents_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U documents -d documents_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15

    env:
      TEST_POSTGRES_DSN: postgres://documents:acceptance-password@localhost:5432/documents_test?sslmode=disable

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version: '1.23.3'
          cache: true
      - name: Install Staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@2024.1.1
      - name: Check formatting
        run: make fmt-check
      - name: Unit and acceptance tests
        run: make test
      - name: Race detector
        run: make test-race
      - name: Vet
        run: make vet
      - name: Staticcheck
        run: make staticcheck
